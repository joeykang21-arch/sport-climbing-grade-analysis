[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sport-grade-history"
version = "1.0.0"
description = "Scraping, cleaning and analysis of sport climbing grade progression from climbing-history.org"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0"]

[project.scripts]
sportgradehistory-scrape-index = "sportgradehistory.scrape_index:main"
sportgradehistory-scrape-details = "sportgradehistory.scrape_details:main"
sportgradehistory-build = "sportgradehistory.build_datasets:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
